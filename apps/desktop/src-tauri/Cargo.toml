[package]
name = "notebookmd-desktop"
version = "0.3.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
trash = "5"
tempfile = "3"
notify = "7"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio-stream = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
urlencoding = "2"
bytes = "1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSWindow", "NSResponder", "NSView"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }
